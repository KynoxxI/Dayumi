name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned for SideStore)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -9 Dayumi-1.42.0.ipa Payload
          ls -la Dayumi-1.42.0.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dayumi-1.42.0-ipa
          path: build/Dayumi-1.42.0.ipa

      - name: Deploy IPA to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no build/Dayumi-1.42.0.ipa "$VPS_USER@$VPS_HOST:/var/www/dayumi.site/dl/ios/Dayumi-1.42.0.ipa"
          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            chown www-data:www-data /var/www/dayumi.site/dl/ios/Dayumi-1.42.0.ipa
            chmod 644 /var/www/dayumi.site/dl/ios/Dayumi-1.42.0.ipa
            SIZE=\$(stat -c%s /var/www/dayumi.site/dl/ios/Dayumi-1.42.0.ipa)
            SHA=\$(sha256sum /var/www/dayumi.site/dl/ios/Dayumi-1.42.0.ipa | awk '{print \$1}')
            echo \"Successfully deployed Dayumi-1.42.0.ipa ($SIZE bytes, sha: $SHA)\"
          "


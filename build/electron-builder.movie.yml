appId: com.dayumi.movie
productName: Dayumi Movie
directories:
  buildResources: build
  output: release/movie
publish:
  - provider: generic
    url: https://dayumi.site/dl/movie
    channel: latest
files:
  - from: dist-movie
    to: dist
    filter:
      - "**/*"
  - electron/**/*
  - src/shared/**/*
  - src/config/instance.js
  - package.json
  - "!node_modules/**/*/{CHANGELOG.md,README.md,README,readme.md}"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.map"
asar: true
asarUnpack:
  - "**/castv2/**/*"
  - "**/ffmpeg-static/**/*"
npmRebuild: false
protocols:
  - name: Dayumi Movie
    schemes:
      - dayumimovie
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-win.${ext}"
  icon: public/movie/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dayumi Movie
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  icon: public/movie/icon.icns
  category: public.app-category.entertainment
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  icon: public/movie/icon.png
  category: AudioVideo
  maintainer: DayumiTeam <contact@dayumi.site>
